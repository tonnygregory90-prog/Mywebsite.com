<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Campus student directory and records manager." />
    <title>CampusDesk — Student Directory</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <a class="brand" href="index.html" aria-label="CampusDesk home">
          <span class="brand-mark" aria-hidden="true">C</span>
          <span>CampusDesk</span>
        </a>
        <nav class="nav-list">
          <a class="nav-item active" href="#directory" aria-current="page">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/></svg>
            Directory
          </a>
        </nav>
        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          Records saved locally
        </div>
      </aside>

      <main class="main-content" id="directory">
        <header class="topbar">
          <button class="menu-button" id="menuButton" type="button" aria-label="Toggle menu" aria-expanded="false">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div>
            <p class="eyebrow">Registry</p>
            <h1>Student directory</h1>
          </div>
          <button class="button button-primary" id="openAddStudent" type="button">
            <span aria-hidden="true">+</span>
            Add student
          </button>
        </header>

        <section class="stats-grid" aria-label="Directory summary">
          <article class="stat-card">
            <div class="stat-icon purple" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div>
              <span class="stat-label">Total students</span>
              <strong class="stat-value" id="totalStudents">0</strong>
            </div>
          </article>
          <article class="stat-card">
            <div class="stat-icon blue" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3 12h18M12 3v18M5 5l14 14M19 5 5 19"/></svg>
            </div>
            <div>
              <span class="stat-label">Records shown</span>
              <strong class="stat-value" id="shownStudents">0</strong>
            </div>
          </article>
        </section>

        <section class="directory-panel" aria-labelledby="directoryTitle">
          <div class="panel-header">
            <h2 id="directoryTitle">All students</h2>
            <button class="button button-secondary" id="exportButton" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
              Export
            </button>
          </div>

          <div class="toolbar">
            <label class="search-box" for="searchInput">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
              <input id="searchInput" type="search" placeholder="Search name, ID, phone or email…" autocomplete="off" />
            </label>
            <label class="sort-control" for="sortSelect">
              <span>Sort:</span>
              <select id="sortSelect">
                <option value="name">Name</option>
                <option value="serial">Student ID</option>
              </select>
            </label>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Student</th>
                  <th scope="col">Phone</th>
                  <th scope="col">Email</th>
                  <th scope="col">Identification</th>
                </tr>
              </thead>
              <tbody id="studentRows"></tbody>
            </table>
            <div class="empty-state" id="emptyState" hidden>
              <div class="empty-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
              </div>
              <h3>No students found</h3>
              <p>Try another search term or add a new record.</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog class="student-dialog" id="studentDialog" aria-labelledby="dialogTitle">
      <form id="studentForm" novalidate>
        <div class="dialog-header">
          <div>
            <p class="eyebrow">New record</p>
            <h2 id="dialogTitle">Add student</h2>
          </div>
          <button class="icon-button" id="closeDialog" type="button" aria-label="Close">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="form-grid">
          <label>
            <span>Student ID</span>
            <input name="serial" required maxlength="30" placeholder="e.g. 0003" />
            <small class="field-error"></small>
          </label>
          <label>
            <span>User name</span>
            <input name="name" required maxlength="80" placeholder="Full name" />
            <small class="field-error"></small>
          </label>
          <label>
            <span>Phone</span>
            <input name="phone" required maxlength="30" inputmode="tel" placeholder="Phone number" />
            <small class="field-error"></small>
          </label>
          <label>
            <span>Email address</span>
            <input name="email" required maxlength="120" type="email" placeholder="name@example.com" />
            <small class="field-error"></small>
          </label>
          <label class="full-width">
            <span>Identification</span>
            <input name="identification" required maxlength="30" placeholder="Identification number" />
            <small class="field-error"></small>
          </label>
        </div>
        <div class="dialog-actions">
          <button class="button button-secondary" id="cancelDialog" type="button">Cancel</button>
          <button class="button button-primary" type="submit">Save student</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
